name: Publish downloads

# On every change to data/ or files/ on main, publish a GitHub Release with:
#   - each data/*.csv converted to .xlsx, plus UBSI_referentiels.xlsx (one sheet per CSV)
#   - UBSI_fichiers.zip containing files/

on:
  push:
    branches: [main]
    paths: ["data/**", "files/**", "scripts/**", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - name: Convert CSV to Excel
        run: python scripts/csv_to_xlsx.py dist
      - name: Zip files/
        run: |
          if [ -n "$(ls -A files 2>/dev/null | grep -v '^.gitkeep$')" ]; then
            zip -rq dist/UBSI_fichiers.zip files -x 'files/.gitkeep'
          fi
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(date -u +%Y-%m-%d-%H%M)"
          prev=$(git describe --tags --abbrev=0 2>/dev/null || true)
          {
            echo "Commit: ${GITHUB_SHA::7}"
            echo
            if [ -n "$prev" ]; then
              echo "Fichiers modifiés depuis $prev :"
              git diff --name-only "$prev" HEAD -- data files | sed 's/^/- /'
            else
              echo "Première publication."
            fi
          } > notes.md
          gh release create "$tag" dist/* --title "$tag" --notes-file notes.md --latest
