name: Portal acceptance

on:
  push:
    branches: [main]
    paths: ["portal/**", ".github/workflows/portal.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
        env:
          POSTGRES_DB: ubsi_ci
          POSTGRES_USER: ubsi_ci
          POSTGRES_PASSWORD: ci-only-ephemeral-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ubsi_ci -d ubsi_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PORTAL_ENV: development
      DEBUG: "false"
      SECRET_KEY: ci-only-unused-secret-key-for-an-isolated-job-0000000000
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgresql://ubsi_ci:ci-only-ephemeral-password@127.0.0.1:5432/ubsi_ci
      PRIVATE_STORAGE_ROOT: /tmp/ubsi-portal-ci-private
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: portal/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - name: Install locked dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends default-jre-headless libcairo2
          python -m pip install --require-hashes --only-binary=:all: -r portal/requirements.lock
          npm --prefix portal ci --ignore-scripts
          mkdir -m 700 "$PRIVATE_STORAGE_ROOT"
      - name: Acquire pinned local document viewers
        run: |
          python portal/scripts/document-assets.py
          python portal/scripts/search-assets.py
          cd portal
          node scripts/document-shapes.mjs
      - name: Build local browser assets
        run: |
          npm --prefix portal run typecheck
          npm --prefix portal run build
      - name: Check application and migrations against PostgreSQL
        run: |
          python portal/manage.py check
          python portal/manage.py makemigrations --check --dry-run
          python portal/manage.py migrate --noinput
          python portal/manage.py migrate --check
          python portal/manage.py collectstatic --noinput
      - name: Run isolated PostgreSQL engineering acceptance
        run: python portal/manage.py test acceptance --noinput
      - name: Preserve CSV export
        run: |
          python -m pip install -r requirements.txt
          python scripts/csv_to_xlsx.py
      - name: Build the reference container
        run: docker build -t ubsi-portal:ci portal
