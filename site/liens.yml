      - nom: Epics du sprint 1 (Notion)

  - titre: Livrables
    liens:
      - nom: Dossier d'architecture (Word)
        statut: brouillon
      - nom: Autres documents (zip)
        url: https://github.com/basile-de-sousa/UBSI-docs/releases/latest/download/UBSI_fichiers.zip
        description: Tout le contenu du dossier files/ du dépôt.
