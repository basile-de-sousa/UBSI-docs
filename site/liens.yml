# Liens du portail UBSI (page publique : https://basile-de-sousa.github.io/UBSI-docs/)
#
# AJOUTER UN LIEN : copiez un bloc "- nom: ..." sous la bonne section, changez les valeurs, commitez sur main.
# RETIRER UN LIEN : supprimez son bloc. La page est republiée en 1 à 2 minutes.
# Si le fichier est mal formé, la publication échoue (croix rouge sur le commit) et l'ancienne page reste en ligne.
#
# Champs d'un lien :
#   nom          obligatoire
#   url          facultatif : sans url, le lien s'affiche "à venir"
#   description  facultatif, une phrase
#   equipes      facultatif : codes de data/applications.csv (PLA, BIL, BKG, EMB, SDV, FID, SAV, BI, SOC, OPS).
#                Sans equipes, le lien concerne tout le monde.
#   statut       facultatif : valide | brouillon | obsolete (valide par défaut)
#   maj          facultatif : date de dernière mise à jour du document, AAAA-MM-JJ
#
# Le dépôt est public : aucun lien vers un document contenant des données personnelles
# (emails, logins Forge, identifiants étudiants).

annonce: "Portail provisoire en attendant le site UBSI. Un lien manque ou ne marche pas ? Contactez les urbanistes."

sections:
  - titre: Référentiels
    description: Sources de vérité partagées entre toutes les équipes.
    liens:
      - nom: Tous les référentiels (Excel)
        url: https://github.com/basile-de-sousa/UBSI-docs/releases/latest/download/UBSI_referentiels.xlsx
        description: Un onglet par référentiel, toujours la dernière version publiée.
      - nom: Applications (Excel)
        url: https://github.com/basile-de-sousa/UBSI-docs/releases/latest/download/applications.xlsx
      - nom: Données (Excel)
        url: https://github.com/basile-de-sousa/UBSI-docs/releases/latest/download/donnees.xlsx
        description: Chaque donnée, son application propriétaire et les applications qui la copient, consultent ou reçoivent.
      - nom: Flux (Excel)
        url: https://github.com/basile-de-sousa/UBSI-docs/releases/latest/download/flux.xlsx
      - nom: Données référentielles (Google Sheets)
        url: https://docs.google.com/spreadsheets/d/1P5lA920FoN0VPuBrBAPFzpdfOyNBNuPTl-CDyq-A48M/edit
        description: Version de travail des urbanistes.
        statut: brouillon
      - nom: Anciennes versions
        url: https://github.com/basile-de-sousa/UBSI-docs/releases
        description: Chaque publication liste les fichiers modifiés.

  - titre: Cartographie et schémas
    liens:
      - nom: Cartographie des flux (itlivemaps)
        description: Carte des flux par application.
      - nom: Fresque du SI (dbdiagram)
        description: Propriété des données, préfixes REF_ (propriétaire) et EMP_ (emprunt).

  - titre: Organisation et sprints
