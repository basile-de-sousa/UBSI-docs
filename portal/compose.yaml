# Local development only. Adapt TLS, secrets, SMTP and backups to the real host.
name: ubsi-portal
services:
  db:
    image: postgres:17.11-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Run scripts/init_dev.py first}
      POSTGRES_USER: ${POSTGRES_USER:?Run scripts/init_dev.py first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init_dev.py first}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: "no"
  migrate:
    image: ubsi-portal:local
    pull_policy: never
    env_file: .env
    environment: &app-environment
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PRIVATE_STORAGE_ROOT: /var/lib/ubsi/private
    volumes: &app-volumes
      - private:/var/lib/ubsi/private
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "manage.py", "migrate", "--noinput"]
    healthcheck:
      disable: true
    restart: "no"
  web:
    build: .
    image: ubsi-portal:local
    env_file: .env
    environment: *app-environment
    volumes: *app-volumes
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
  worker:
    image: ubsi-portal:local
    pull_policy: never
    env_file: .env
    environment: *app-environment
    volumes: *app-volumes
    command: ["python", "manage.py", "run_worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true
    mem_limit: 2g
    cpus: 1.5
    pids_limit: 128
    restart: "no"
volumes:
  database:
  private:
