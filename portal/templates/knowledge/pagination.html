{% if page.has_other_pages %}<nav class="pagination" aria-label="Pages de résultats">{% if page.has_previous %}<a href="?{{ filter_query }}&page={{ page.previous_page_number }}">Page précédente</a>{% endif %}<span>Page {{ page.number }} sur {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a href="?{{ filter_query }}&page={{ page.next_page_number }}">Page suivante</a>{% endif %}</nav>{% endif %}
