# Reference only: confirm the supplied host, proxy, SMTP and backup destination.
name: ubsi-portal-production
services:
  db:
    image: postgres:17.11-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Configure the private environment}
      POSTGRES_USER: ${POSTGRES_USER:?Configure the private environment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure the private environment}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  migrate:
    image: ${PORTAL_IMAGE:?Set the release image by immutable digest}
    env_file: ${PORTAL_ENV_FILE:?Set an absolute private environment file}
    environment: &environment
      PORTAL_ENV: production
      DEBUG: "false"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PRIVATE_STORAGE_ROOT: /var/lib/ubsi/private
    volumes: &volumes
      - private:/var/lib/ubsi/private
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "manage.py", "migrate", "--noinput"]
    healthcheck:
      disable: true
    restart: "no"
  web:
    image: ${PORTAL_IMAGE:?Set the release image by immutable digest}
    env_file: ${PORTAL_ENV_FILE:?Set an absolute private environment file}
    environment: *environment
    volumes: *volumes
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=128m
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  worker:
    image: ${PORTAL_IMAGE:?Set the release image by immutable digest}
    env_file: ${PORTAL_ENV_FILE:?Set an absolute private environment file}
    environment: *environment
    volumes: *volumes
    command: ["python", "manage.py", "run_worker"]
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=128m
    mem_limit: 2g
    cpus: 1.5
    pids_limit: 128
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true
    restart: unless-stopped
volumes:
  database:
  private:
