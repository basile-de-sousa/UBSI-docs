# Explicit opt-in development mailbox. No forwarding or relay is configured.
services:
  mailpit:
    image: axllent/mailpit:v1.31.5@sha256:94f6b70c1436defae6799d9ac7ff0eeff9540465b842026d5cdb018f1c0234ea
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    restart: "no"
  web:
    environment:
      DEBUG: "false"
      EMAIL_HOST: mailpit
      EMAIL_PORT: "1025"
      EMAIL_USE_TLS: "false"
      EMAIL_USE_SSL: "false"
      DEFAULT_FROM_EMAIL: portail@example.invalid
      PUBLIC_BASE_URL: http://127.0.0.1:8000
    depends_on:
      mailpit:
        condition: service_started
